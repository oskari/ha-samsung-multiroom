name: Samsung Multiroom Speakers
version: "0.2.1"
slug: samsung_wam
description: >-
  Wi-Fi setup, grouping and a Spotify Connect bridge for Samsung Wireless Audio
  Multiroom speakers (Shape M3/M5/M7, Radiant R1-R7)
url: https://github.com/oskari/ha-samsung-multiroom
# Prebuilt by .github/workflows/ci.yaml; Home Assistant downloads it instead of
# building the Dockerfile on each machine.
image: ghcr.io/oskari/samsung-multiroom
arch:
  - amd64
  - aarch64
# Host networking: speakers must reach the stream server, and Spotify finds the
# bridges through local discovery (mDNS) on the home network.
host_network: true
ingress: true
ingress_port: 8098
panel_icon: mdi:speaker-wireless
panel_title: Samsung Speakers
# Only used for the optional "new speaker" Wi-Fi setup through the host's own
# Wi-Fi adapter, which needs the Supervisor network API.
hassio_api: true
hassio_role: manager
options:
  accept_spotify_terms: false
  soloist_api_key: ""
  stream_port: 8099
schema:
  accept_spotify_terms: bool
  soloist_api_key: password
  stream_port: port
  advertise_ip: str?
